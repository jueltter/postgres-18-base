# Connection settings
listen_addresses = '*'

# Module settings
shared_preload_libraries = 'pgaudit, pg_stat_statements'

# Logging configuration
log_destination = 'stderr'
logging_collector = off
# log_directory = '/var/log/postgresql'
# log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'none'         # Let pgAudit handle statements instead
log_line_prefix = '%m [%p] %u@%d ' # Adds time, PID, user, and DB to each line
log_timezone = 'America/Guayaquil'

# setting for row counts
log_duration = off
# 0 = log all statements, -1 = disabled (default), >0 = log only statements slower than X milliseconds
log_min_duration_statement = 1000

# pgAudit Specific settings
pgaudit.log = 'write, ddl'
pgaudit.log_catalog = off
pgaudit.log_parameter = on # Logs the values in parameterized queries
pgaudit.log_relation = on # Logs separate entries for each table involved
pgaudit.log_rows = on

# pg_stat_statements specific settings
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.save = on