workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+(\.\d+){2,}$/'
    - when: never

stages:
  - build

build_and_push:
  stage: build
  image: docker:29.6.0-cli
  services:
    - name: docker:29.6.0-dind
  tags:
    - shared
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    IMAGE_NAME: $REGISTRY_DOMAIN/development/infrastructure/postgres-18-base/postgres-18-base
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build with Dockerfile and push
    - docker build --provenance=false --platform linux/amd64 -t $IMAGE_NAME:$CI_COMMIT_TAG .
    - docker push $IMAGE_NAME:$CI_COMMIT_TAG